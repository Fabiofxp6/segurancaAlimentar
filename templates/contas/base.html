{% extends "base.html" %}

{% block cabecalho %}
<style>
    :root { color-scheme: light; color: #142d28; background: #f2f6f3; font-family: Inter, system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 1rem; }
    .conta { width: min(100%, 28rem); padding: clamp(1.25rem, 4vw, 2.25rem); background: white; border: 1px solid #cedbd4; border-radius: 1rem; }
    .sistema { color: #404f48; font-size: .9rem; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.15rem); margin: .5rem 0 1.5rem; line-height: 1.2; }
    .campo { margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .35rem; }
    input, button { font: inherit; width: 100%; min-height: 2.75rem; padding: .65rem .75rem; border-radius: .45rem; }
    input { color: inherit; border: 1px solid #697d72; }
    input[aria-invalid="true"] { border-color: #9b272b; }
    button { color: white; background: #195342; border: 1px solid transparent; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: .7; cursor: wait; }
    :focus-visible { outline: 3px solid #186b56; outline-offset: 3px; }
    a { color: #195342; font-weight: 600; }
    .errorlist { color: #8b2025; padding-inline-start: 1.2rem; }
    .errorlist.nonfield { background: #fff0f0; border: 1px solid #d7a1a2; border-radius: .5rem; padding: .75rem 1.6rem; }
    .usuario { overflow-wrap: anywhere; }
</style>
{% endblock %}

{% block conteudo %}
<section class="conta" aria-labelledby="titulo-conta">
    <p class="sistema">Sistema de Avaliação de Segurança Alimentar</p>
    {% block conta %}{% endblock %}
</section>
{% endblock %}
